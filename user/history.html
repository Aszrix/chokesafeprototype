<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ChokeSafe | History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
    <style>
        .nav-links { display: flex; gap: 1rem; align-items: center; }
        .hamburger { display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #1e293b; padding: 0.25rem 0.5rem; }
        @media (max-width: 640px) {
            .nav-links { display: none; flex-direction: column; gap: 0.5rem; padding: 0.75rem 0; width: 100%; align-items: flex-start; }
            .nav-links.open { display: flex; }
            .hamburger { display: block; }
            .nav-container { flex-wrap: wrap; }
            .nav-links button { font-size: 0.85rem !important; padding: 0.4rem 0 !important; }
        }
    </style>
</head>
<body class="bg-stone-50 min-h-screen text-stone-800 font-sans">

    <nav class="bg-white border-b border-rose-100 p-3 md:p-4 sticky top-0 z-50 shadow-sm">
        <div class="max-w-2xl mx-auto flex justify-between items-center nav-container">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🛡️</span>
                <h1 class="font-black text-xl md:text-2xl text-rose-700 tracking-tight cursor-pointer hover:text-rose-800 transition-colors" onclick="window.location.href='homepage.html'">ChokeSafe</h1>
            </div>
            <button class="hamburger" onclick="toggleNav()" aria-label="Toggle navigation">☰</button>
            <div class="nav-links" id="nav-links">
                <button onclick="window.location.href='homepage.html'" class="text-stone-500 hover:text-rose-600 font-medium text-xs md:text-sm">Home</button>
                <button onclick="window.location.href='scan.html'" class="text-stone-500 hover:text-rose-600 font-medium text-xs md:text-sm">Scan</button>
                 <button onclick="window.location.href='chatbot.html'" class="nav-link-custom text-stone-600 hover:text-rose-600 font-medium text-xs md:text-sm">Chat</button>
            <button onclick="window.location.href='report.html'" class="nav-link-custom text-stone-600 hover:text-rose-600 font-medium text-xs md:text-sm">Report</button>
                <button id="nav-history-btn" onclick="window.location.href='history.html'" class="text-rose-600 font-medium text-xs md:text-sm hidden">History</button>
                <button onclick="window.location.href='guide.html'" class="text-stone-500 hover:text-rose-600 font-medium text-xs md:text-sm">Guide</button>
                <button id="nav-account-btn" onclick="window.location.href='account.html'" class="text-stone-500 hover:text-rose-600 font-medium text-xs md:text-sm hidden">Account</button>
                <button onclick="handleLogout()" class="bg-stone-100 text-stone-600 px-2 md:px-3 py-1 md:py-1.5 rounded-lg text-[10px] md:text-xs font-bold hover:bg-rose-100 hover:text-rose-700 transition-colors">Sign Out</button>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto p-3 md:p-8">
        <div class="bg-white p-4 md:p-6 rounded-2xl md:rounded-3xl shadow-sm border border-rose-100">
            <div class="flex justify-between items-center mb-4 md:mb-6">
                <h2 class="text-xl md:text-2xl font-bold text-stone-900">Scan History Logs</h2>
                <button id="clear-all-btn" onclick="clearAllUserLogs()" class="hidden text-[10px] md:text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 px-2 md:px-3 py-1 md:py-2 rounded-xl border border-rose-100 transition-colors">
                    Clear All
                </button>
            </div>
            
            <div class="overflow-x-auto -mx-4 px-4 md:mx-0 md:px-0">
                <div id="history-container" class="space-y-3 min-w-[300px]"></div>
            </div>
        </div>
    </main>

   <script src="auth.js"></script>
<script>
    function toggleNav() { document.getElementById('nav-links').classList.toggle('open'); }

    // ─── RENDER HISTORY (Firebase) ──────────────────────────────────
    async function renderHistoryLogs() {
        const container = document.getElementById('history-container');
        const clearAllBtn = document.getElementById('clear-all-btn');
        const currentPhone = sessionStorage.getItem("current_session_phone");

        try {
            const snapshot = await db.collection('scans')
                .where('phone', '==', currentPhone)
                .orderBy('timestamp', 'desc')
                .get();

            const userLogs = [];
            snapshot.forEach(doc => {
                userLogs.push({ id: doc.id, ...doc.data() });
            });

            if (userLogs.length === 0) {
                container.innerHTML = `<p class="text-stone-500 text-xs md:text-sm py-4 text-center">No scans recorded yet.</p>`;
                clearAllBtn.classList.add('hidden');
                return;
            }

            clearAllBtn.classList.remove('hidden');
            container.innerHTML = userLogs.map(item => {
                const badgeColor = item.riskLevel === 'High' ? 'bg-red-100 text-red-800' :
                    item.riskLevel === 'Medium' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800';
                const dateStr = item.timestamp ? new Date(item.timestamp.toDate()).toLocaleString() : 'N/A';
                return `<div class="p-3 md:p-4 border border-stone-100 rounded-xl bg-stone-50 space-y-2 relative group transition-all">
                    <div class="flex justify-between items-start flex-wrap gap-1">
                        <div><h4 class="font-bold text-stone-800 text-sm md:text-base">${item.foodName}</h4>
                        <p class="text-stone-400 text-[10px] md:text-[11px]">${dateStr}</p></div>
                        <div class="flex items-center gap-1.5">
                            <span class="px-2 md:px-3 py-0.5 rounded-full text-[10px] md:text-xs font-bold ${badgeColor}">${item.riskLevel}</span>
                            <button onclick="deleteSingleLog('${item.id}')" class="text-stone-400 hover:text-red-600 p-1 text-[10px] md:text-xs font-medium border border-stone-200 rounded-lg bg-white shadow-sm px-2">Delete</button>
                        </div>
                    </div>
                    <p class="text-[10px] md:text-xs text-stone-600"><strong class="text-stone-700">Reason:</strong> ${item.reason}</p>
                    <p class="text-[10px] md:text-xs text-stone-600"><strong class="text-stone-700">Advice:</strong> ${item.advice}</p>
                </div>`;
            }).join('');

        } catch (err) {
            console.error('Error loading history:', err);
            container.innerHTML = `<p class="text-stone-500 text-xs md:text-sm py-4 text-center">Error loading history.</p>`;
        }
    }

    // ─── DELETE SINGLE LOG (Firebase) ──────────────────────────────
    async function deleteSingleLog(recordId) {
        if (!confirm("Remove this scan history record?")) return;
        try {
            await db.collection('scans').doc(recordId).delete();
            renderHistoryLogs();
        } catch (err) {
            alert('Delete failed: ' + err.message);
            console.error(err);
        }
    }

    // ─── CLEAR ALL USER LOGS (Firebase) ──────────────────────────────
    async function clearAllUserLogs() {
        if (!confirm("Permanently clear all your scan history? This cannot be undone.")) return;
        const currentPhone = sessionStorage.getItem("current_session_phone");
        try {
            const snapshot = await db.collection('scans').where('phone', '==', currentPhone).get();
            const batch = db.batch();
            snapshot.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
            renderHistoryLogs();
        } catch (err) {
            alert('Clear failed: ' + err.message);
            console.error(err);
        }
    }

    function initPageSpecificUI() { renderHistoryLogs(); }

    document.addEventListener('DOMContentLoaded', function() {
        // The routing guard in auth.js will call initPageSpecificUI
    });
    window.toggleNav = toggleNav;
</script>
</body>
</html>
