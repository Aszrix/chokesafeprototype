<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
    <script src="admin.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 30%, #fecdd3 70%, #fda4af 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .reset-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.2);
        }
        .logo-icon {
            background: linear-gradient(135deg, #e11d48, #be123c);
            width: 4.5rem;
            height: 4.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            box-shadow: 0 8px 24px rgba(225, 29, 72, 0.25);
        }
        .logo-icon span { font-size: 2.5rem; }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 1rem;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.8);
            outline: none;
        }
        .form-input:focus {
            border-color: #e11d48;
            box-shadow: 0 0 0 4px rgba(225, 29, 72, 0.1);
            background: white;
        }
        .btn-rose {
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: white;
            font-weight: 600;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 1rem;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
        }
        .error-msg {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            border: 1px solid #fecaca;
        }
        .error-msg.hidden { display: none; }
        .success-msg {
            background: #dcfce7;
            color: #166534;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            border: 1px solid #bbf7d0;
        }
        .success-msg.hidden { display: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="reset-card">
        <div class="logo-icon">
            <span>🔑</span>
        </div>

        <h1 class="text-2xl font-black text-center text-rose-700 tracking-tight">Reset Password</h1>
        <p class="text-center text-stone-500 text-sm mt-1 mb-6">Enter your admin ID to reset your password</p>

        <!-- Step 1: Verify Admin ID -->
        <div id="step-verify">
            <div class="mb-4">
                <label for="reset-username" class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1.5">Admin ID</label>
                <input type="text" id="reset-username" class="form-input" placeholder="Enter admin ID" value="admin">
            </div>
            <button onclick="verifyAdmin()" class="btn-rose">Verify & Continue</button>
            <div id="verify-error" class="error-msg hidden mt-3">Admin ID not found. Please check and try again.</div>
        </div>

        <!-- Step 2: Set New Password -->
        <div id="step-reset" class="hidden">
            <p class="text-sm text-stone-600 mb-4">Admin ID: <strong id="display-username">admin</strong></p>
            <div class="mb-4">
                <label for="new-password" class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1.5">New Password</label>
                <input type="password" id="new-password" class="form-input" placeholder="Enter new password">
            </div>
            <div class="mb-4">
                <label for="confirm-password" class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1.5">Confirm Password</label>
                <input type="password" id="confirm-password" class="form-input" placeholder="Confirm new password">
            </div>
            <button onclick="resetPassword()" class="btn-rose">Update Password</button>
            <div id="reset-error" class="error-msg hidden mt-3"></div>
            <div id="reset-success" class="success-msg hidden mt-3">✅ Password updated successfully! Redirecting to login...</div>
        </div>

        <!-- Back to Login -->
        <div class="mt-4 text-center">
            <a href="index.html" class="text-sm text-stone-500 hover:text-rose-600 transition-colors">← Back to Login</a>
        </div>
    </div>

    <script>
        // ─── Step 1: Verify Admin ID (Firestore) ─────────────────────────
        async function verifyAdmin() {
            const username = document.getElementById('reset-username').value.trim();
            const errorEl = document.getElementById('verify-error');
            errorEl.classList.add('hidden');

            try {
                const snapshot = await db.collection('admins').where('id', '==', username).get();

                if (snapshot.empty) {
                    errorEl.classList.remove('hidden');
                    return;
                }

                document.getElementById('step-verify').classList.add('hidden');
                document.getElementById('step-reset').classList.remove('hidden');
                document.getElementById('display-username').textContent = username;
                document.getElementById('reset-error').classList.add('hidden');
                document.getElementById('reset-success').classList.add('hidden');
            } catch (err) {
                errorEl.textContent = 'Verification failed: ' + err.message;
                errorEl.classList.remove('hidden');
                console.error(err);
            }
        }

        // ─── Step 2: Reset Password (Firestore) ──────────────────────────
        async function resetPassword() {
            const username = document.getElementById('display-username').textContent;
            const newPass = document.getElementById('new-password').value.trim();
            const confirmPass = document.getElementById('confirm-password').value.trim();
            const errorEl = document.getElementById('reset-error');
            const successEl = document.getElementById('reset-success');

            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');

            if (!newPass || newPass.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters.';
                errorEl.classList.remove('hidden');
                return;
            }

            if (newPass !== confirmPass) {
                errorEl.textContent = 'Passwords do not match.';
                errorEl.classList.remove('hidden');
                return;
            }

            try {
                const snapshot = await db.collection('admins').where('id', '==', username).get();
                if (snapshot.empty) {
                    errorEl.textContent = 'Admin not found. Please try again.';
                    errorEl.classList.remove('hidden');
                    return;
                }

                await snapshot.docs[0].ref.update({ password: newPass });

                successEl.classList.remove('hidden');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2500);
            } catch (err) {
                errorEl.textContent = 'Reset failed: ' + err.message;
                errorEl.classList.remove('hidden');
                console.error(err);
            }
        }

        // ─── Enter key support ──────────────────────────────────────────
        document.getElementById('reset-username').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') verifyAdmin();
        });
        document.getElementById('new-password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') resetPassword();
        });
        document.getElementById('confirm-password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') resetPassword();
        });
    </script>
</body>
</html>
